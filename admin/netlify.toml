# Netlify: set Base directory to "admin" and these are picked up automatically
[build]
  command = "npm run build"
  publish = "dist"

# Public privacy policy (linked from the app and Google Play)
[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/delete-account"
  to = "/privacy.html#delete-account"
  status = 301

# Single page app: send every other path to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
